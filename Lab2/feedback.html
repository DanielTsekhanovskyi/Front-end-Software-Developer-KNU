<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Зворотній зв'язок - СтепАгро</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <header class="index-header" style="position: relative; z-index: 1;">
        <img src="./assets/images/logo.jpg" alt="Логотип" width="80" style="float: left; margin-right: 20px;">
        <h1>Зв'яжіться з нами</h1>
    </header>

    <main class="feedback-container">
        <form class="feedback-form" action="#" method="POST">
            <fieldset>
                <legend>Персональна інформація</legend>

                <label for="fullname">Прізвище та ім'я:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="age">Вік:</label>
                <input type="number" id="age" name="age" min="16" max="120">

                <label>Освіта:</label>
                <div>
                    <input type="radio" id="edu1" name="education" value="повна"> <label for="edu1">Повна</label>
                    <input type="radio" id="edu2" name="education" value="неповна"> <label for="edu2">Неповна</label>
                    <input type="radio" id="edu3" name="education" value="вища"> <label for="edu3">Вища</label>
                </div>
            </fieldset>

            <label for="purpose">Мета зворотнього зв'язку:</label>
            <select id="purpose" name="purpose">
                <option value="cooperation">Співпраця</option>
                <option value="complaint">Скарга</option>
                <option value="proposal">Пропозиція</option>
            </select>

            <label for="details">Детально:</label>
            <textarea id="details" name="details" rows="5" placeholder="Опишіть ваше питання..."></textarea>

            <div>
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">Даю згоду на обробку персональних даних</label>
            </div>

            <button type="submit">Відправити форму</button>
            <button type="reset">Очистити</button>
        </form>
    </main>

    <div style="text-align: center; margin-bottom: 30px;">
        <a href="index.html" style="color: black;">На Головну сторінку</a>
    </div>
</body>
</html>
